name: CI NumPy compatibility

on:
  push:
    branches: [main]
    paths:
      - "erroranalysis/**"
      - "rai_test_utils/**"
      - "raiutils/**"
      - "responsibleai/**"
      - "raiwidgets/**"
      - "numpy_compatibility_tests/**"
      - ".github/workflows/CI-numpy-compatibility.yml"
  pull_request:
    branches: [main]
    paths:
      - "erroranalysis/**"
      - "rai_test_utils/**"
      - "raiutils/**"
      - "responsibleai/**"
      - "raiwidgets/**"
      - "numpy_compatibility_tests/**"
      - ".github/workflows/CI-numpy-compatibility.yml"

permissions:
  contents: read

jobs:
  ci-numpy-compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - numpyVersion: "1.23.5"
            pythonVersion: "3.9"
            dependencySet: legacy
          - numpyVersion: "1.26.4"
            pythonVersion: "3.11"
            dependencySet: pandas1
          - numpyVersion: "1.26.4"
            pythonVersion: "3.11"
            dependencySet: latest
          - numpyVersion: "2.0.2"
            pythonVersion: "3.11"
            dependencySet: latest
          - numpyVersion: "2.0.2"
            pythonVersion: "3.11"
            dependencySet: numpy2-baseline
          - numpyVersion: "2.2.6"
            pythonVersion: "3.11"
            dependencySet: latest

    runs-on: ${{ matrix.pythonVersion == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.pythonVersion }}

      - name: Install ${{ matrix.dependencySet }} dependencies with NumPy ${{ matrix.numpyVersion }}
        run: |
          python -m pip install --upgrade pip "setuptools<82"
          constraint_file="${{ github.workspace }}/numpy-constraints.txt"
          echo "numpy==${{ matrix.numpyVersion }}" > "$constraint_file"
          if [[ "${{ matrix.dependencySet }}" == "legacy" ]]; then
            cat >> "$constraint_file" <<EOF
          pandas==1.5.3
          scipy==1.10.1
          scikit-learn==1.2.2
          statsmodels==0.13.5
          lightgbm==3.3.5
          dice-ml==0.11
          econml==0.15.1
          interpret-community==0.31.0
          interpret-core==0.5.0
          shap==0.43.0
          ml-wrappers==0.5.6
          networkx==2.5
          numba==0.58.1
          EOF
          elif [[ "${{ matrix.dependencySet }}" == "pandas1" ]]; then
            cat >> "$constraint_file" <<EOF
          pandas==1.5.3
          dice-ml==0.11
          EOF
          elif [[ "${{ matrix.dependencySet }}" == "numpy2-baseline" ]]; then
            cat >> "$constraint_file" <<EOF
          pandas==2.2.2
          scipy==1.13.0
          scikit-learn==1.4.2
          statsmodels==0.14.2
          lightgbm==4.4.0
          dice-ml==0.12
          econml==0.16.0
          interpret-community==0.33.0
          interpret-core==0.6.9
          shap==0.46.0
          ml-wrappers==0.6.4
          networkx==3.2.1
          EOF
          fi
          PIP_CONSTRAINT="$constraint_file" pip install \
            "numpy==${{ matrix.numpyVersion }}" pytest \
            -e ./raiutils \
            -e ./erroranalysis \
            -e ./rai_test_utils \
            -e ./responsibleai \
            -e ./raiwidgets

      - name: Verify dependency consistency
        run: |
          python -c "import numpy; assert numpy.__version__ == '${{ matrix.numpyVersion }}'"
          pip check

      - name: Run NumPy compatibility tests
        run: |
          pytest numpy_compatibility_tests -v

name: CI e2e notebooks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ui-build:
    env:
      node-version: 22.21.1

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.node-version }}

      - name: Install yarn
        run: npm install yarn -g

      - name: Install yarn dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if yarn install --frozen-lock-file; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
            sleep 30
          done

      - name: Build Typescript
        run: yarn buildall

      - name: Upload the build result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raiwidgets-js
          path: raiwidgets/raiwidgets/widget

  ci-e2e-notebook:
    needs: ui-build

    env:
      CYPRESS_VERIFY_TIMEOUT: 120000
      node-version: 22.21.1

    strategy:
      fail-fast: false
      matrix:
        # TODO: add macos
        operatingSystem: [ubuntu-latest, windows-latest]
        pythonVersion: [3.9, "3.10"]
        flights: ["", "dataBalanceExperience"]
        notebookGroup: ["nb_group_1", "nb_group_2", "nb_group_3"]
        exclude:
          # nb_group_3 includes only forecasting which doesn't change
          # with the data balance experience flight
          - notebookGroup: "nb_group_3"
            flights: "dataBalanceExperience"

    runs-on: ${{ matrix.operatingSystem }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.node-version }}

      - name: Set up Python 3.10 for node-gyp
        id: nodegyp_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          update-environment: false

      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          auto-update-conda: true
          python-version: ${{ matrix.pythonVersion }}

      - name: Install yarn
        run: npm install yarn -g

      - name: Install yarn dependencies
        shell: bash -l {0}
        env:
          npm_config_python: ${{ steps.nodegyp_python.outputs.python-path }}
        run: |
          for attempt in 1 2 3; do
            if yarn install --frozen-lock-file; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
            sleep 30
          done

      - name: Download the UI build result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raiwidgets-js
          path: raiwidgets/raiwidgets/widget

      - name: Install pytorch
        shell: bash -l {0}
        run: |
          conda install --yes --quiet "pytorch<2.1" "torchvision<0.16" captum cpuonly "numpy<1.24.0" -c pytorch

      - name: Setup tools
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "setuptools<82"
          pip install --upgrade "pip-tools<=7.1.0"

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          pip install -r requirements-dev.txt
          pip install -v -e .
        working-directory: raiwidgets

      - name: Fix zope packages for conda/pip compatibility
        shell: bash -l {0}
        run: |
          pip uninstall --yes zope.event zope.interface
          pip install --no-deps "zope.event==4.5.0" "zope.interface<8"

      - name: Pip freeze
        shell: bash -l {0}
        run: |
          pip freeze > installed-requirements-dev.txt
          cat installed-requirements-dev.txt
        working-directory: raiwidgets

      - if: ${{ (matrix.operatingSystem == 'windows-latest') && (matrix.pythonVersion == '3.9') && (matrix.flights == '') && (matrix.notebookGroup == 'nb_group_1') }}
        name: Upload requirements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: requirements-dev.txt
          path: raiwidgets/installed-requirements-dev.txt

      # keep list of notebooks in sync with scripts/e2e-widget.js, create new notebook group if necessary
      - if: ${{ matrix.notebookGroup == 'nb_group_1'}}
        name: Run widget tests
        shell: bash -l {0}
        run: |
          yarn e2e-widget -n "responsibleaidashboard-census-classification-model-debugging" -f ${{ matrix.flights }}
          yarn e2e-widget -n "responsibleaidashboard-diabetes-regression-model-debugging" -f ${{ matrix.flights }}
          yarn e2e-widget -n "responsibleaidashboard-housing-decision-making" -f ${{ matrix.flights }}

      - if: ${{ matrix.notebookGroup == 'nb_group_2'}}
        name: Run widget tests
        shell: bash -l {0}
        run: |
          yarn e2e-widget -n "responsibleaidashboard-housing-classification-model-debugging" -f ${{ matrix.flights }}
          yarn e2e-widget -n "responsibleaidashboard-diabetes-decision-making" -f ${{ matrix.flights }}
          yarn e2e-widget -n "responsibleaidashboard-multiclass-dnn-model-debugging" -f ${{ matrix.flights }}

      - if: ${{ matrix.notebookGroup == 'nb_group_3'}}
        name: Run widget tests
        shell: bash -l {0}
        run: |
          yarn e2e-widget -n "responsibleaidashboard-orange-juice-forecasting" -f ${{ matrix.flights }}

      - name: Upload e2e test screen shot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raiwidgets-ci-e2e-notebooks-screen-shot-${{ matrix.notebookGroup }}-${{ matrix.flights }}-${{ matrix.operatingSystem }}-${{ matrix.pythonVersion }}
          path: ./dist/cypress

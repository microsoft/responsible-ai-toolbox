name: CI RAIWidgets pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci-raiwidgets-pytest:
    env:
      node-version: 22.21.1
    strategy:
      # keep running remaining matrix jobs even if one fails
      # to avoid having to rerun all jobs several times
      fail-fast: false
      matrix:
        packageDirectory: ["raiwidgets"]
        operatingSystem: [ubuntu-latest, macos-latest, windows-latest]
        pythonVersion: [3.9, "3.10"]
        exclude:
          - packageDirectory: "raiwidgets"
            operatingSystem: macos-latest
            pythonVersion: 3.9

    runs-on: ${{ matrix.operatingSystem }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          auto-update-conda: true
          python-version: ${{ matrix.pythonVersion }}

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.node-version }}
          cache: "yarn"

      - if: ${{ matrix.operatingSystem == 'macos-latest' }}
        name: Install latest numpy from conda-forge for MacOS
        shell: bash -l {0}
        run: |
          conda install --yes --quiet -c conda-forge "numpy<2.0.0"

      - if: ${{ matrix.operatingSystem == 'macos-latest' }}
        name: Verify Node.js version on macOS
        shell: bash -e {0}
        run: |
          node --version
          npm --version
          which node

      - if: ${{ matrix.operatingSystem == 'macos-latest' }}
        name: Use Homebrew to install libomp on MacOS
        shell: bash -l {0}
        run: |
          brew install libomp

      - if: ${{ matrix.operatingSystem == 'macos-latest' }}
        name: Install macos node-gyp dependencies for build
        shell: bash -l {0}
        run: |
          brew install cairo
          brew install pango

      - name: Setup tools
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "setuptools<82"
          pip install --upgrade "pip-tools<=7.1.0"

      - if: ${{ matrix.operatingSystem == 'macos-latest' }}
        name: Install compatible LightGBM on MacOS
        shell: bash -l {0}
        run: |
          pip install "cmake<4" wheel
          pip install --no-build-isolation "lightgbm==3.3.5"

      - if: ${{ matrix.operatingSystem != 'macos-latest' }}
        name: Install yarn (non-macOS)
        shell: bash -l {0}
        run: npm install yarn -g

      - if: ${{ matrix.operatingSystem == 'macos-latest' }}
        name: Install yarn (macOS)
        shell: bash -e {0}
        run: npm install yarn -g

      - if: ${{ matrix.operatingSystem != 'macos-latest' }}
        name: Install yarn dependencies (non-macOS)
        shell: bash -l {0}
        run: yarn install --frozen-lock-file

      - if: ${{ matrix.operatingSystem == 'macos-latest' }}
        name: Install yarn dependencies (macOS)
        shell: bash -e {0}
        run: |
          node --version
          export npm_config_python="${CONDA}/envs/test/bin/python"
          "$npm_config_python" --version
          yarn install --frozen-lock-file

      - name: Build Typescript
        shell: bash -e {0}
        run: yarn buildall

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          if [[ "${{ matrix.operatingSystem }}" == "macos-latest" ]]; then
            pip install -r requirements-dev.txt
          else
            pip install -r requirements-dev.txt --ignore-installed
          fi
          pip install "scipy>=1.4.1,<1.14" --force-reinstall --no-deps
          pip install -v -e .
        working-directory: ${{ matrix.packageDirectory }}

      - name: Pip freeze
        shell: bash -l {0}
        run: |
          pip freeze > installed-requirements-dev.txt
          cat installed-requirements-dev.txt
        working-directory: ${{ matrix.packageDirectory }}

      - if: ${{ (matrix.operatingSystem == 'windows-latest') && (matrix.pythonVersion == '3.9') }}
        name: Upload requirements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: requirements-dev.txt
          path: ${{ matrix.packageDirectory }}/installed-requirements-dev.txt

      - name: Run tests
        shell: bash -l {0}
        id: raiwidgettests
        run: |
          pytest -s -v --durations=10 --junitxml=junit/test-results.xml --cov=${{ matrix.packageDirectory }} --cov-report=xml --cov-report=html
        working-directory: ${{ matrix.packageDirectory }}

      - if: ${{ (steps.raiwidgettests.outcome == 'success') }}
        name: Upload code coverage results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.packageDirectory }}-${{ matrix.pythonVersion}}-code-coverage-results
          path: ${{ matrix.packageDirectory }}-${{ matrix.pythonVersion}}/htmlcov

      - if: ${{ (matrix.operatingSystem == 'windows-latest') && (matrix.pythonVersion == '3.9') }}
        name: Upload to codecov
        id: codecovupload1
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ${{ matrix.packageDirectory }}
          env_vars: OS,PYTHON
          fail_ci_if_error: false
          files: ./${{ matrix.packageDirectory }}/coverage.xml
          flags: unittests
          name: codecov-umbrella
          verbose: true

      - if: ${{ (steps.codecovupload1.outcome == 'failure') && (matrix.pythonVersion == '3.9') && (matrix.operatingSystem == 'windows-latest') }}
        name: Retry upload to codecov
        id: codecovupload2
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ${{ matrix.packageDirectory }}
          env_vars: OS,PYTHON
          fail_ci_if_error: false
          files: ./${{ matrix.packageDirectory }}/coverage.xml
          flags: unittests
          name: codecov-umbrella
          verbose: true

      - name: Set codecov status
        if: ${{ (matrix.pythonVersion == '3.9') && (matrix.operatingSystem == 'windows-latest') }}
        shell: bash
        run: |
          if ${{ (steps.codecovupload1.outcome == 'success') || (steps.codecovupload2.outcome == 'success') }} ; then
            echo fine
          else
            exit 1
          fi
